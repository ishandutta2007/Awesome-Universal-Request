<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#12182c" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dashMove 20s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 10;
        animation: dashMoveReverse 24s linear infinite;
      }
      .node-pulse-cyan {
        animation: pulseCyan 4s ease-in-out infinite;
      }
      .node-pulse-purple {
        animation: pulsePurple 4.5s ease-in-out infinite 0.5s;
      }
      .node-pulse-emerald {
        animation: pulseEmerald 5s ease-in-out infinite 1s;
      }
      .node-pulse-rose {
        animation: pulseRose 4.2s ease-in-out infinite 1.5s;
      }
      .node-pulse-amber {
        animation: pulseAmber 4.8s ease-in-out infinite 2s;
      }
      .float-gentle {
        animation: floatGentle 6s ease-in-out infinite alternate;
      }
      .banner-grid {
        opacity: 0.12;
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes dashMoveReverse {
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulseCyan {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulsePurple {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulseEmerald {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulseRose {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulseAmber {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes floatGentle {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Background -->
  <g class="banner-grid" stroke="#475569" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Ambient Background Glow Spheres -->
  <circle cx="200" cy="80" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1020" cy="100" r="160" fill="#8b5cf6" opacity="0.14" filter="url(#glow)" />
  <circle cx="600" cy="360" r="180" fill="#ec4899" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Cross-Department Connecting Paths (Background Layer) -->
  <g fill="none" opacity="0.45">
    <!-- Center to Nodes -->
    <path class="flow-line" d="M 600,190 C 450,150 320,110 170,80" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line-reverse" d="M 600,190 C 420,230 300,290 160,330" stroke="#fbbf24" stroke-width="2" />
    <path class="flow-line" d="M 600,190 C 750,140 880,100 1040,75" stroke="#c084fc" stroke-width="2" />
    <path class="flow-line-reverse" d="M 600,190 C 780,240 900,300 1050,335" stroke="#34d399" stroke-width="2" />
    <path class="flow-line" d="M 600,190 C 600,270 600,310 600,345" stroke="#fb7185" stroke-width="2" />
  </g>

  <!-- Department Capability Pills (Background/Midground - Out of Center) -->
  <!-- Top Left: IT Operations -->
  <g transform="translate(90, 58)" class="node-pulse-cyan">
    <rect width="150" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#38bdf8" filter="url(#subtleGlow)" />
    <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">💻 IT Service</text>
  </g>

  <!-- Bottom Left: Facilities -->
  <g transform="translate(80, 310)" class="node-pulse-amber">
    <rect width="165" height="42" rx="21" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#fbbf24" filter="url(#subtleGlow)" />
    <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🏢 Facilities Desk</text>
  </g>

  <!-- Top Right: HR Service Delivery -->
  <g transform="translate(955, 54)" class="node-pulse-purple">
    <rect width="160" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#c084fc" filter="url(#subtleGlow)" />
    <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">👥 HR Cases</text>
  </g>

  <!-- Bottom Right: Legal & Compliance -->
  <g transform="translate(965, 315)" class="node-pulse-emerald">
    <rect width="155" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#34d399" filter="url(#subtleGlow)" />
    <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">⚖️ Legal / GRC</text>
  </g>

  <!-- Bottom Center: Finance & Procurement -->
  <g transform="translate(515, 325)" class="node-pulse-rose">
    <rect width="170" height="40" rx="20" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#fb7185" filter="url(#subtleGlow)" />
    <text x="38" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">💳 Finance Approvals</text>
  </g>

  <!-- FOREGROUND LAYER: STRICTLY ON TOP AND UNCOVERED -->
  <g id="foreground" text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(425, 48)">
      <rect width="350" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="175" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" text-anchor="middle">⚡ ENTERPRISE SERVICE MANAGEMENT</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Universal Request
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="0.4">
      Unified Cross-Departmental Service Delivery &amp; Next-Gen ITSM Stack
    </text>

    <!-- Description Details -->
    <text x="600" y="224" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.2">
      Curated directory of SaaS category leaders, self-hosted open-source ticketing engines &amp; routing frameworks
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(240, 260)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🔄 Cross-Org Routing</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🎯 Single Request SLA</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(375, 0)">
        <rect width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🛡️ Sovereign &amp; Hosted</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(555, 0)">
        <rect width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🤖 AI-Native Triage</text>
      </g>
    </g>
  </g>
</svg>